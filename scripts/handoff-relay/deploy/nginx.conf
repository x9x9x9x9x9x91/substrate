limit_req_zone $binary_remote_addr zone=handoff_store:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=handoff_read:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=handoff_client:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name drop.substrate.zone;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drop.substrate.zone;

    ssl_certificate /etc/letsencrypt/live/drop.substrate.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.substrate.zone/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:handoff_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/substrate-handoff-error.log crit;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 32m;
    client_body_timeout 30s;

    location = /api/store {
        limit_req zone=handoff_store burst=3 nodelay;
        limit_conn handoff_client 2;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=handoff_read burst=20 nodelay;
        limit_conn handoff_client 6;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
