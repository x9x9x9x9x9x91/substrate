# The blob store's route on the TLS terminator, as deployed on alp1 inside the
# host's existing single-name site. It is a route, not a site: the host already
# terminates TLS for one name, and a second server block for the same name would
# be ignored by nginx.
#
# The two zone directives belong in the http context (the top of the site file);
# the location belongs in the `server` block that owns the certificate.
#
# Per docs/hosted-sync-protocol.md §7 the server has no rate limiting of its own
# — per-IP limits are the proxy's job, and these are them. The connection cap in
# the server (64) is a resource bound behind these, not a substitute.

limit_req_zone $binary_remote_addr zone=blob_api:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=blob_client:10m;

# --- inside `server { server_name <host>; ... }` ------------------------------

location ^~ /blob/ {
    limit_req zone=blob_api burst=120 nodelay;
    limit_conn blob_client 16;

    # The largest legal object envelope is 64 MiB of ciphertext plus framing;
    # anything past this is refused here rather than on the loopback hop.
    client_max_body_size 68m;

    # The trailing slash strips the /blob prefix, so the upstream sees the §2.1
    # paths verbatim and the client's base URL is https://<host>/blob.
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
