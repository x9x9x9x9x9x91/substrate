<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Substrate Agenda</title>
    <style>
      /* This window is transparent so only the rounded `.palette`
         card paints. This inline rule covers the frame before styles.css
         loads; the `body.agenda-window` rule in styles.css is what actually
         beats its opaque `body { background: var(--bg) }`, since Vite injects
         that sheet after this element. */
      html,
      body,
      #root {
        background: transparent;
      }
    </style>
  </head>

  <body class="agenda-window" spellcheck="false" autocorrect="off" autocapitalize="off">
    <div id="root"></div>
    <script type="module" src="/src/agenda.tsx"></script>
  </body>
</html>
