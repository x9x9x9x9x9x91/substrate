stages:
  - verify

.node-job:
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-${CI_JOB_NAME}
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit

typecheck:
  extends: .node-job
  script:
    - npx tsc --noEmit

unit-tests:
  extends: .node-job
  script:
    - npm test

# e2e: Playwright smoke suite (e2e/) against the mock IPC backend — no Tauri,
# no vault. Same cache key pattern as the other node jobs, plus the browser
# download (keyed on package-lock, which pins the playwright version).
e2e:
  extends: .node-job
  variables:
    PLAYWRIGHT_BROWSERS_PATH: ${CI_PROJECT_DIR}/.ms-playwright
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-${CI_JOB_NAME}
    paths:
      - .npm/
      - node_modules/
      - .ms-playwright/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit
    - npx playwright install --with-deps chromium
  script:
    - npm run e2e
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 1 week

engine-tests:
  stage: verify
  image: rust:1.97.1-bookworm
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/src-tauri/target
    CARGO_TERM_COLOR: always
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - src-tauri/target/
    policy: pull-push
  before_script:
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      libayatana-appindicator3-dev
      librsvg2-dev
      libssl-dev
      libwebkit2gtk-4.1-dev
      libxdo-dev
      pkg-config &&
      rm -rf /var/lib/apt/lists/*
  script:
    - cd src-tauri
    - cargo test --lib --locked

# static gates for the TS side: ESLint errors only (warnings are a tracked
# backlog, see eslint.config.js). Same cache pattern as the other node jobs.
lint:
  extends: .node-job
  script:
    - npm run lint



# static gates for the Rust side. Shares engine-tests' toolchain, apt deps and
# cache shape — clippy --all-targets compiles the test cfg too, so it wants the
# same system libraries.
rust-lint:
  stage: verify
  image: rust:1.97.1-bookworm
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/src-tauri/target
    CARGO_TERM_COLOR: always
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - src-tauri/target/
    policy: pull-push
  before_script:
    - rustup component add clippy rustfmt
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      libayatana-appindicator3-dev
      librsvg2-dev
      libssl-dev
      libwebkit2gtk-4.1-dev
      libxdo-dev
      pkg-config &&
      rm -rf /var/lib/apt/lists/*
  script:
    - cd src-tauri
    - cargo fmt --check
    - cargo clippy --all-targets --locked -- -D warnings
