stages:
  - verify

.node-job:
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-${CI_JOB_NAME}
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit

typecheck:
  extends: .node-job
  script:
    - npx tsc --noEmit

unit-tests:
  extends: .node-job
  script:
    - npm test

# e2e: Playwright smoke suite (e2e/) against the mock IPC backend — no Tauri,
# no vault. Same cache key pattern as the other node jobs, plus the browser
# download (keyed on package-lock, which pins the playwright version).
e2e:
  extends: .node-job
  variables:
    PLAYWRIGHT_BROWSERS_PATH: ${CI_PROJECT_DIR}/.ms-playwright
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-${CI_JOB_NAME}
    paths:
      - .npm/
      - node_modules/
      - .ms-playwright/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit
    - npx playwright install --with-deps chromium
  script:
    - npm run e2e
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 1 week

engine-tests:
  stage: verify
  image: rust:1.97.1-bookworm
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/src-tauri/target
    CARGO_TERM_COLOR: always
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - src-tauri/target/
    policy: pull-push
  before_script:
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      libayatana-appindicator3-dev
      librsvg2-dev
      libssl-dev
      libwebkit2gtk-4.1-dev
      libxdo-dev
      pkg-config &&
      rm -rf /var/lib/apt/lists/*
  script:
    - cd src-tauri
    - cargo test --lib --locked

# coverage: the node suite again, under V8 coverage, published as an artifact
# (`coverage/least-covered.md` — the tree ranked by unexercised lines — beside
# raw lcov). REPORT ONLY: there is no threshold, no floor, and no percentage
# that can fail a pipeline. `allow_failure` says so structurally — if the suite
# under instrumentation dies, unit-tests above is the job that reports it, and
# the partial report is still published rather than lost.
#
# It is a second full run of unit-tests' battery, so it does not ride every
# branch pipeline: the default branch and schedules, manual elsewhere. Nothing
# a merge waits on reads it.
#
# It needs no newer node than the suite itself: the coverage flags it adds are
# the ones that have been there since v22.5, deliberately not the include-all
# walk, which is much newer and which the report does not need.
coverage:
  extends: .node-job
  allow_failure: true
  script:
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
    expose_as: "Coverage — least covered files"
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# static gates for the TS side: ESLint errors only (warnings are a tracked
# backlog, see eslint.config.js). Same cache pattern as the other node jobs.
lint:
  extends: .node-job
  script:
    - npm run lint



# static gates for the Rust side. Shares engine-tests' toolchain, apt deps and
# cache shape — clippy --all-targets compiles the test cfg too, so it wants the
# same system libraries.
rust-lint:
  stage: verify
  image: rust:1.97.1-bookworm
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/src-tauri/target
    CARGO_TERM_COLOR: always
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - src-tauri/target/
    policy: pull-push
  before_script:
    - rustup component add clippy rustfmt
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      libayatana-appindicator3-dev
      librsvg2-dev
      libssl-dev
      libwebkit2gtk-4.1-dev
      libxdo-dev
      pkg-config &&
      rm -rf /var/lib/apt/lists/*
  script:
    - cd src-tauri
    - cargo fmt --check
    - cargo clippy --all-targets --locked -- -D warnings
