[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
# rustup auto-installs the pinned channel but never auto-adds targets, so the
# iOS builds (scripts/release-ios.sh) need them declared here.
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "x86_64-apple-ios"]
