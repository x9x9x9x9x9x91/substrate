[package]
name = "substrate"
version = "0.29.0"
description = "Substrate — local-first notes, databases, dashboards"
license = "AGPL-3.0-only"
edition = "2021"
default-run = "substrate"

[lib]
name = "substrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Clippy gate (CI runs `cargo clippy --all-targets -- -D warnings`). Only the
# lints we've deliberately ruled on live here; everything else keeps its
# default level so new warnings surface instead of being pre-silenced.
[lints.clippy]
# Tauri IPC commands take their arguments flat — that IS the wire shape, and
# the engine methods behind them mirror it 1:1. The four sites over the
# default 7 (vault_views_set/vault_schema_set and their Engine halves) are
# option bags, not tangled logic; bundling them into structs would add a
# serde type per command purely to satisfy a count.
too_many_arguments = { level = "allow", priority = 1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` pairs with `macOSPrivateApi: true` in tauri.conf.json
# (the build script fails if the two disagree). It enables the transparent
# window path the tray agenda popover needs — an opaque window
# painted a black square behind the card's 12px radius.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
walkdir = "2"
chrono = "0.4"
chrono-tz = "0.10"
icalendar = { version = "0.17.13", features = ["parser", "recurrence"] }
regex = "1"
base64 = "0.22"
# already in the tree as `age`'s own dependency — named here because a space
# derives its letterbox identity from the space master key rather than storing
# one (docs/collab.md 2.1), and `age` offers no from-bytes constructor: the
# derived 32 bytes are spelled as the AGE-SECRET-KEY- string age's own parser
# accepts, so the validation stays age's and this crate only does the encoding.
bech32 = "0.11"
# already in the tree via tauri's updater — named here because kinds.rs hashes
# custom-kind bundles itself and mounts digest file content for
# sidecar identity
sha2 = "0.10"
# reality mounts: `uuid` names a mount portably across machines
uuid = { version = "1", features = ["v4"] }
# sealed notes: age encrypts whole-file note bodies at rest
age = "0.12.1"
# Keyholders recovery cards: Shamir secret sharing over GF(256) for the
# vault-lock key. `blahaj` is the maintained fork of the `sharks` crate — small,
# splits arbitrary byte slices, and takes the same rand 0.8 the hosted-sync
# crypto already uses. Hand-rolled field math is not an option here. Default
# features carry `zeroize_memory`, which wipes a share's bytes on drop.
blahaj = "0.6"
# the printed card's QR block. `svg` only: the image renderer would drag in the
# whole `image` crate to draw something the print surface renders as vectors.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ureq = "2"
# Hosted-sync client crypto. The server only ever receives the
# envelopes these primitives produce; key derivation and encryption stay here.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# already in the tree transitively — named so the hosted-sync passphrase can
# be NFC-normalized at the Rust boundary, not only in the pane
unicode-normalization = "0.1"
# also already in the tree transitively — named so a space's allowlist can
# compare names the way a case-insensitive filesystem does, across the whole
# of Unicode rather than the ASCII range (`gitsync/space.rs`)
unicase = "2"
# already in the tree as ureq's own dependency — named here because net.rs
# parses and re-joins redirect targets itself (SSRF guard)
url = "2"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
# mount extraction: pure-Rust readers for the two file
# kinds a mounted folder is most often full of. Metadata, plus a capped run of
# a PDF's own text — no image decoding, no rendering, no C toolchain, so the
# tree stays buildable everywhere the app already builds. `lopdf` runs with
# default features off: its image/rayon/date extras are for AUTHORING PDFs,
# and extraction only reads the catalog and the content streams behind it.
lofty = "0.24"
lopdf = { version = "0.44", default-features = false }
# an Ableton project file is one gzipped XML document, so reading one is
# exactly these two: inflate the stream, then walk it as events. Both are
# already in the tree as transitive dependencies and both are pure Rust —
# named here because extraction calls them directly. `flate2` stays on its
# default `miniz_oxide` backend (no zlib, no C toolchain), and `quick-xml`
# runs with default features: a pull parser over a reader, no DOM, so a
# 200 MB project inflates through a fixed buffer instead of into memory.
flate2 = "1.1"
quick-xml = "0.41"
# substrate:// deep links: the plugin owns scheme registration and
# the OS open-url callback on every platform the app ships to.
tauri-plugin-deep-link = "2.4.9"

# tray + global shortcuts are desktop-only concepts; on iOS/Android the
# feature/plugin don't exist, so they ride the desktop target cfg
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# in-app updater — desktop-only: iOS updates ship through TestFlight/
# App Store, and the updater plugin doesn't build for mobile targets anyway
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# terminal HUD — a real PTY so full-screen TUIs (agent CLIs) render;
# desktop-only like the tray: no shell to embed on iOS/Android
portable-pty = "0.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

# Interactive macOS notifications (click + snooze actions) — the
# desktop API of tauri-plugin-notification is fire-and-forget, so due-date
# alerts use the same NSUserNotification backend directly.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# Hand internal drags back to WebKit (src/dragfix.rs) — same objc2
# the wry/tauri stack already builds with
objc2 = "0.6"
# NSString/NSURL/NSArray for the Vision call that reads text out of images
objc2-foundation = "0.3"
# NSVisualEffectView behind the window so the desktop shines through
# at the user's chosen opacity. The blur is the OS material's, never a CSS
# backdrop-filter over our own content (which would blur the notes too).
# Pinned to the 0.6 line tauri 2.11 already depends on: a looser "0.8" resolves
# to a SECOND copy of the crate in the lockfile (and so a second row in
# THIRD-PARTY-LICENSES.md and a second AppKit binding set in the bundle) for an
# API this uses identically either way.
window-vibrancy = "0.6"
# Voice capture. macOS-only for now: whisper's `metal` feature is an
# Apple-GPU path, and the shipped desktop app is macOS. Linux/Windows would
# need an ALSA/WASAPI cpal build plus a CPU whisper backend — a port, not a
# cfg flip, so it stays off until someone asks for it. iOS is phase 2 (needs
# the mobile capture surface first).
#
# BUILD HOST NOTE: whisper-rs-sys compiles whisper.cpp through bindgen, so a
# machine building this needs **cmake** and **libclang** on PATH. libclang
# comes with the Xcode Command Line Tools; cmake does not, so the rig setup
# script installs it (a cold cargo cache is what exposes the gap).
cpal = "0.15"
hound = "3.5"
whisper-rs = { version = "0.14", features = ["metal"] }

# Meaning search — on-device sentence embeddings. macOS-only for the same
# reason voice capture is: the runtime below is a per-platform native library
# and the shipped desktop app is macOS. Keeping the whole set behind this cfg
# is also what lets the `ios` gate build an app with no embedding runtime in it
# at all.
#
# `default-features = false` matters: ort's default `download-binaries` feature
# fetches a prebuilt ONNX Runtime from its maintainer's CDN at build time,
# unpinned. `load-dynamic` instead means NO native dependency at link time —
# nothing here has to exist for `cargo build` to succeed. The library is
# dlopened at first use from a pinned, checksummed copy that
# scripts/fetch-onnxruntime.sh installs; a machine without it simply reports
# that meaning search isn't set up. `api-27` must stay in lockstep with
# ORT_API_LEVEL in that script.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "std",
  "load-dynamic",
  "api-27",
] }
# The tokenizer half of the model. `default-features = false` drops the
# progress bars and the HTTP model-hub client — this only ever loads a
# tokenizer.json already on disk, and must never fetch one.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"
# The hosted-sync round-trip runs the REAL server, in-process and over
# a real localhost socket, so `cargo test` proves the protocol across the wire
# rather than against a file-backed model of it. A dev-dependency: the server
# ships as its own binary and none of it reaches the app.
substrate-hosted-sync-server = { path = "../hosted-sync-server" }
