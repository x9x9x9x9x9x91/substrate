<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Tray/menu-bar mark: the bare knockout star from icon.svg, no tile, no
       gradients — solid black on transparency so macOS can tint it as a
       template image (icon_as_template). Full-bleed and heavily stroked: an
       earlier version reused the app tile's inner geometry, which spent ~half
       the 18pt box on padding and measured the smallest, thinnest glyph in the
       menu bar next to Ivory/Fantastical/Spark/Dropbox.
       Butt caps and a stroke (148) wider than the inner radius (118) keep the
       hexagonal void closed and readable — ~4 device px across at 36px. -->
  <g stroke="#000000" stroke-width="148" stroke-linecap="butt" fill="none">
    <line x1="512.0" y1="394.0" x2="512.0" y2="60.0"/>
    <line x1="614.2" y1="453.0" x2="903.4" y2="286.0"/>
    <line x1="614.2" y1="571.0" x2="903.4" y2="738.0"/>
    <line x1="512.0" y1="630.0" x2="512.0" y2="964.0"/>
    <line x1="409.8" y1="571.0" x2="120.6" y2="738.0"/>
    <line x1="409.8" y1="453.0" x2="120.6" y2="286.0"/>
  </g>
</svg>
