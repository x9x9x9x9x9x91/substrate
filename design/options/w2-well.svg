<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1E24"/>
      <stop offset="0.45" stop-color="#131419"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <radialGradient id="toplight" cx="0.5" cy="0.05" r="1.0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9BDC8"/>
    </linearGradient>
    <linearGradient id="markdim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#toplight)"/>
  <defs>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040507"/>
      <stop offset="0.75" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#14151B"/>
    </linearGradient>
    <clipPath id="holeclip"><circle cx="512" cy="512" r="238"/></clipPath>
  </defs>
  <circle cx="512" cy="512" r="238" fill="url(#hole)"/>
  <g clip-path="url(#holeclip)">
    <circle cx="512" cy="500" r="238" fill="none" stroke="#000000" stroke-opacity="0.75" stroke-width="34" filter="url(#shadow)"/>
    <circle cx="512" cy="530" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="12" filter="url(#soft)"/>
  </g>
  <circle cx="512" cy="514" r="239" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#vignette)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#edge)" stroke-width="5"/>
</svg>
