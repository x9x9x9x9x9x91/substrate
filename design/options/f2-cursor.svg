<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1E24"/>
      <stop offset="0.45" stop-color="#131419"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <radialGradient id="toplight" cx="0.5" cy="0.05" r="1.0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9BDC8"/>
    </linearGradient>
    <linearGradient id="markdim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#toplight)"/>
  <rect x="270" y="330" width="330" height="30" rx="15" fill="url(#markdim)" opacity="0.72"/>
  <rect x="270" y="410" width="240" height="30" rx="15" fill="url(#markdim)" opacity="0.72"/>
  <rect x="270" y="640" width="180" height="30" rx="15" fill="url(#markdim)" opacity="0.72"/>
  <rect x="560" y="486" width="88" height="240" rx="24" fill="#000000" opacity="0.5" filter="url(#shadow)"/>
  <rect x="560" y="470" width="88" height="240" rx="24" fill="#ffffff" opacity="0.5" filter="url(#glow)"/>
  <rect x="560" y="470" width="88" height="240" rx="24" fill="url(#mark)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#vignette)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#edge)" stroke-width="5"/>
